name: Build and release

on:
    push:
        branches: ['**']
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-24.04
        outputs:
            package: ${{ steps.version.outputs.package }}
            release: ${{ steps.version.outputs.release }}
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    persist-credentials: false
            -   name: Read release version
                id: version
                shell: python
                run: |
                    import os
                    import re
                    from pathlib import Path

                    projectVersion = re.search(r"project\(MinecraftOld3dsPatcher VERSION ([0-9.]+)", Path("CMakeLists.txt").read_text()).group(1)
                    releaseTag = ""
                    if os.environ["GITHUB_EVENT_NAME"] == "push":
                        if os.environ["GITHUB_REF"].startswith("refs/tags/v"):
                            releaseTag = os.environ["GITHUB_REF_NAME"]
                        elif os.environ["GITHUB_REF"] == "refs/heads/main":
                            releaseTag = "v" + projectVersion

                    with open(os.environ["GITHUB_OUTPUT"], "a") as outputFile:
                        outputFile.write("package=" + (releaseTag or "dev") + "\n")
                        outputFile.write("release=" + releaseTag + "\n")

    build:
        needs: version
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-24.04
                        platform: linux
                        binaryDir: build
                    -   os: windows-2022
                        platform: windows
                        binaryDir: build/Release
        runs-on: ${{ matrix.os }}
        env:
            RELEASE_VERSION: ${{ needs.version.outputs.package }}
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                with:
                    persist-credentials: false
            -   name: Install Linux dependencies
                if: runner.os == 'Linux'
                run: sudo apt-get update && sudo apt-get install -y libssl-dev
            -   name: Configure Linux
                if: runner.os == 'Linux'
                run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMC3DS_FETCH_TOOLS=ON
            -   name: Configure Windows
                if: runner.os == 'Windows'
                run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMC3DS_FETCH_TOOLS=ON
            -   name: Build
                run: cmake --build build --config Release --parallel 2
            -   name: Package and smoke test
                run: python scripts/packageRelease.py --platform ${{ matrix.platform }} --binary-dir ${{ matrix.binaryDir }}
            -   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: mc3ds-patcher-${{ matrix.platform }}-x64
                    path: dist/*
                    if-no-files-found: error
                    compression-level: 0

    release:
        if: needs.version.outputs.release != ''
        needs: [version, build]
        runs-on: ubuntu-24.04
        concurrency:
            group: release-${{ needs.version.outputs.release }}
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: ${{ needs.version.outputs.release }}
        steps:
            -   uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    pattern: mc3ds-patcher-*-x64
                    merge-multiple: true
                    path: dist
            -   name: Verify packages and publish release
                working-directory: dist
                shell: bash
                run: |
                    set -euo pipefail
                    sha256sum --check ./*.sha256
                    cat ./*.sha256 > SHA256SUMS.txt
                    releaseOptions=()
                    if [[ "$RELEASE_TAG" == *-* ]]; then
                        releaseOptions+=(--prerelease)
                    fi

                    releaseExists=false
                    if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
                        releaseExists=true
                        if [[ "$(cat release-state.txt)" != true ]]; then
                            echo "$RELEASE_TAG is already published. Bump CMakeLists.txt for the next release."
                            exit 0
                        fi
                    fi

                    if tagCommit=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha 2>tag-error.txt); then
                        if [[ "$tagCommit" != "$GITHUB_SHA" ]]; then
                            echo "$RELEASE_TAG points to a different commit. Use a new version."
                            exit 1
                        fi
                    elif [[ "$GITHUB_REF" == refs/tags/* ]] || ! grep -q 'HTTP 404' tag-error.txt; then
                        cat tag-error.txt
                        exit 1
                    fi

                    if [[ "$releaseExists" == true ]]; then
                        gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
                        gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS.txt --clobber
                    else
                        gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS.txt \
                            --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --generate-notes "${releaseOptions[@]}"
                    fi

                    gh release edit "$RELEASE_TAG" --draft=false "${releaseOptions[@]}"
